<div (click)="close.emit()" aria-hidden="true" class="hc-overlay-backdrop"></div>

<section
  #dialog
  aria-labelledby="add-vehicle-modal-title"
  aria-modal="true"
  class="hc-dialog"
  role="dialog"
  tabindex="-1"
>
  <button
    (click)="close.emit()"
    aria-label="Close add vehicle dialog"
    class="hc-dialog__close"
    type="button"
  >
    ×
  </button>

  <header class="hc-dialog__header">
    <h2 id="add-vehicle-modal-title">Add a vehicle</h2>
  </header>

  <form (ngSubmit)="submit()" [formGroup]="form" class="hc-form" novalidate>
    @if (serverError(); as error) {
      <div class="hc-alert hc-alert--error" role="alert">
        <p>{{ error.message }}</p>
        @if (error.fieldMessages.length > 0) {
          <ul>
            @for (fieldMessage of error.fieldMessages; track fieldMessage) {
              <li>{{ fieldMessage }}</li>
            }
          </ul>
        }
      </div>
    }

    <label class="hc-field">
      <span>VIN</span>
      <input formControlName="vin" maxlength="17" placeholder="17-character VIN" type="text" />
      @if (form.controls.vin.touched && form.controls.vin.hasError('required')) {
        <small>VIN is required.</small>
      } @else if (
        form.controls.vin.touched &&
        (form.controls.vin.hasError('minlength') ||
          form.controls.vin.hasError('maxlength') ||
          form.controls.vin.hasError('pattern'))
      ) {
        <small>{{ vinValidationMessage }}</small>
      }
    </label>

    <label class="hc-field">
      <span>Current Mileage</span>
      <input formControlName="currentMileage" min="0" type="number" />
      @if (
        form.controls.currentMileage.touched && form.controls.currentMileage.hasError('required')
      ) {
        <small>Current mileage is required.</small>
      } @else if (
        form.controls.currentMileage.touched && form.controls.currentMileage.hasError('min')
      ) {
        <small>Mileage cannot be negative.</small>
      }
    </label>

    <button
      [disabled]="isSubmitting()"
      class="hc-btn hc-btn--primary hc-btn--dialog-submit"
      type="submit"
    >
      {{ isSubmitting() ? 'Adding...' : 'Add Vehicle' }}
    </button>
  </form>
</section>
