<div (click)="close.emit()" aria-hidden="true" class="auth-modal__backdrop"></div>

<section
        #dialog
        aria-labelledby="delete-vehicle-modal-title"
        aria-modal="true"
        class="auth-modal"
        role="dialog"
        tabindex="-1"
>
    <button (click)="close.emit()" aria-label="Close delete vehicle dialog" class="auth-modal__close" type="button">
        ×
    </button>

    <header class="auth-modal__header">
        <h2 id="delete-vehicle-modal-title">Delete Vehicle</h2>
    </header>

    <div class="auth-modal__form">
        <p style="color: var(--color-text-muted); text-align: center; margin-bottom: 1rem;">
            Are you sure you want to delete the vehicle with VIN {{ vin() }}? This action cannot be undone.
        </p>

        @if (serverError(); as error) {
        <div class="auth-modal__server-error" role="alert">
            <p>{{ error }}</p>
        </div>
        }

        <button (click)="submit()" [disabled]="isSubmitting()" class="auth-modal__submit" style="background: #a92a2a;"
                type="button">
            {{ isSubmitting() ? 'Deleting...' : 'Delete Vehicle' }}
        </button>
        <button (click)="close.emit()" [disabled]="isSubmitting()" class="auth-modal__switch-button"
                style="margin-top: 1rem; width: 100%;" type="button">
            Cancel
        </button>
    </div>
</section>
