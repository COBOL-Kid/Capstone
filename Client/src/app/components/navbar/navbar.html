<nav aria-label="Primary" class="navbar">
  <ul class="navbar__list">
    <li class="navbar__item">
      <a
        [routerLink]="homeLink()"
        [routerLinkActiveOptions]="{ exact: homeLink() === '/' }"
        class="navbar__link"
        routerLinkActive="navbar__link--active"
        >Home</a
      >
    </li>
    <li class="navbar__item">
      <a class="navbar__link" routerLink="/about" routerLinkActive="navbar__link--active"
        >About Us</a
      >
    </li>
  </ul>

  <button (click)="accountDrawer.open()" class="navbar__account-button" type="button">
    Account
  </button>
</nav>

<app-account-drawer #accountDrawer />
