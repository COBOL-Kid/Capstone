@if (toasts().length > 0) {
  <div
    (mouseenter)="pauseTimers()"
    (mouseleave)="resumeTimers()"
    aria-live="polite"
    class="hc-toast-host"
  >
    @for (toast of toasts(); track toast.id) {
      <div
        [attr.role]="role(toast)"
        [class.hc-toast--error]="toast.variant === 'error'"
        [class.hc-toast--info]="toast.variant === 'info'"
        [class.hc-toast--leaving]="isLeaving(toast.id)"
        [class.hc-toast--success]="toast.variant === 'success'"
        class="hc-toast"
      >
        <span aria-hidden="true" class="hc-toast__icon">
          @switch (toast.variant) {
            @case ('success') {
              <svg fill="none" height="18" viewBox="0 0 24 24" width="18">
                <path
                  d="M20 6 9 17l-5-5"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.25"
                />
              </svg>
            }
            @case ('error') {
              <svg fill="none" height="18" viewBox="0 0 24 24" width="18">
                <path
                  d="M12 8v5m0 3.5h.01M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.7 3.86a2 2 0 0 0-3.4 0Z"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                />
              </svg>
            }
            @default {
              <svg fill="none" height="18" viewBox="0 0 24 24" width="18">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
                <path
                  d="M12 11v5m0-8.5h.01"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="2"
                />
              </svg>
            }
          }
        </span>
        <p class="hc-toast__message">{{ toast.message }}</p>
        <button
          (click)="dismiss(toast.id)"
          aria-label="Dismiss notification"
          class="hc-toast__close"
          type="button"
        >
          ×
        </button>
      </div>
    }
  </div>
}
