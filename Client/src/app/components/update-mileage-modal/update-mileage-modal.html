<div (click)="close.emit()" aria-hidden="true" class="hc-overlay-backdrop"></div>

<section
  #dialog
  aria-labelledby="update-mileage-modal-title"
  aria-modal="true"
  class="hc-dialog"
  role="dialog"
  tabindex="-1"
>
  <button
    (click)="close.emit()"
    aria-label="Close update mileage dialog"
    class="hc-dialog__close"
    type="button"
  >
    ×
  </button>

  <header class="hc-dialog__header">
    <h2 id="update-mileage-modal-title">Update Mileage</h2>
  </header>

  <form (ngSubmit)="submit()" [formGroup]="form" class="hc-form" novalidate>
    <label class="hc-field">
      <span>Current mileage</span>
      <input formControlName="currentMileage" min="0" required type="number" />
    </label>

    @if (serverError(); as error) {
      <div class="hc-alert hc-alert--error" role="alert">
        <p>{{ error }}</p>
      </div>
    }

    <button
      [disabled]="isSubmitting()"
      class="hc-btn hc-btn--primary hc-btn--dialog-submit"
      type="submit"
    >
      {{ isSubmitting() ? 'Saving...' : 'Save mileage' }}
    </button>
  </form>
</section>
