<div (click)="close.emit()" aria-hidden="true" class="hc-overlay-backdrop"></div>

<section
  #dialog
  aria-labelledby="vehicle-photo-modal-title"
  aria-modal="true"
  class="hc-dialog vehicle-photo-modal__dialog"
  role="dialog"
  tabindex="-1"
>
  <button
    (click)="close.emit()"
    [disabled]="savingUrl() !== null"
    aria-label="Close vehicle photos dialog"
    class="hc-dialog__close"
    type="button"
  >
    ×
  </button>

  <header class="hc-dialog__header">
    <h2 id="vehicle-photo-modal-title">Vehicle photos</h2>
    <p class="vehicle-photo-modal__subtitle">Select a photo to use as the default image.</p>
  </header>

  <div class="vehicle-photo-modal__body">
    @if (availableImageUrls().length === 0) {
      <p class="vehicle-photo-modal__status">No photos available.</p>
    } @else {
      <div class="vehicle-photo-modal__grid" role="list">
        @for (url of availableImageUrls(); track url; let index = $index) {
          <button
            (click)="selectPhoto(url)"
            [aria-label]="'Select photo ' + (index + 1)"
            [aria-pressed]="isSelected(url)"
            [class.vehicle-photo-modal__tile--selected]="isSelected(url)"
            [class.vehicle-photo-modal__tile--saving]="isSaving(url)"
            [disabled]="savingUrl() !== null"
            class="vehicle-photo-modal__tile"
            role="listitem"
            type="button"
          >
            <img
              [alt]="'Vehicle photo ' + (index + 1)"
              [src]="url"
              class="vehicle-photo-modal__image"
            />
            @if (isSelected(url)) {
              <span aria-hidden="true" class="vehicle-photo-modal__check">✓</span>
            }
            @if (isSaving(url)) {
              <span aria-hidden="true" class="vehicle-photo-modal__saving">Saving...</span>
            }
          </button>
        }
      </div>
    }
  </div>

  @if (serverError(); as error) {
    <div class="hc-alert hc-alert--error" role="alert">
      <p>{{ error }}</p>
    </div>
  }
</section>
