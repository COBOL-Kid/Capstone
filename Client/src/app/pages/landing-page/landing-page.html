<section class="landing" aria-labelledby="landing-title">
  <img
    class="landing__image"
    ngSrc="landing-background.png"
    fill
    priority
    alt=""
  />
  <div class="landing__overlay" aria-hidden="true"></div>

  <div class="landing__content">
    <h1 id="landing-title" class="landing__title">Honest Car</h1>

    <div class="landing__actions" role="group" aria-label="Authentication actions">
      <a
        class="btn btn--primary"
        routerLink="/sign-up"
      >Sign Up</a>
      <a
        class="btn btn--ghost"
        routerLink="/sign-in"
      >Sign In</a>
    </div>
  </div>
</section>
