<section aria-labelledby="landing-title" class="landing">
    <img
            alt=""
            class="landing__image"
            fill
            ngSrc="landing-background.png"
            priority
    />
    <div aria-hidden="true" class="landing__overlay"></div>

    <div class="landing__content">
        <h1 class="landing__title" id="landing-title">Honest Car</h1>

        <div aria-label="Authentication actions" class="landing__actions" role="group">
            <a
                    class="btn btn--primary"
                    routerLink="/sign-up"
            >Sign Up</a>
            <a
                    class="btn btn--ghost"
                    routerLink="/sign-in"
            >Sign In</a>
        </div>
    </div>

    @if (authModalMode(); as mode) {
        <app-auth-modal
                (close)="closeAuthModal()"
                [class.auth-modal-closing]="isAuthModalClosing()"
                [mode]="mode"
        />
    }
</section>
