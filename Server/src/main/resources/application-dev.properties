spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
logging.level.com.capstone.integration=DEBUG
app.public-url=${APP_PUBLIC_URL:http://localhost:4200}
security.cookies.secure=false
# E2E Playwright: no-op email delivery and deterministic verification codes (never enable in prod).
security.e2e.stub-email=${E2E_STUB_EMAIL:false}
security.e2e.fixed-verification-code=${E2E_FIXED_VERIFICATION_CODE:}
