# Cloud Run injects PORT; default 8080 matches the service port and EXPOSE in Server/Dockerfile.
server.port=${PORT:8080}
app.public-url=${APP_PUBLIC_URL:https://honest-car.co}
# Cloud Run terminates TLS and forwards client metadata via X-Forwarded-* headers.
# FRAMEWORK registers Spring's ForwardedHeaderFilter so request.getRemoteAddr()
# returns the client IP set by Google's proxy (not the internal hop).
server.forward-headers-strategy=framework
# Structured JSON logs for Cloud Logging (MDC keys such as requestId are included automatically).
logging.structured.format.console=logstash
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.AUDIT=INFO
logging.level.ACCESS=INFO
# Set GCP_PROJECT_ID on Cloud Run for trace correlation in logs.
gcp.project-id=${GCP_PROJECT_ID:}
