spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.threads.virtual.enabled=true
security.jwt.secret=${SECRET_KEY:}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
security.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
security.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4200
# Vehicle data providers (AUTODEV_* / VEHICLE_DATA_* from .env or platform secrets)
vehicle-data.autodev.base-url=${AUTODEV_BASE_URL:https://api.auto.dev}
vehicle-data.autodev.api-key=${AUTODEV_API_KEY:}
vehicle-data.autodev.api-key-header=${AUTODEV_API_KEY_HEADER:x-api-key}
vehicle-data.vehicle-databases.base-url=${VEHICLE_DATA_BASE_URL:https://api.vehicledatabases.com}
vehicle-data.vehicle-databases.api-key=${VEHICLE_DATA_API_KEY:}
vehicle-data.vehicle-databases.api-key-header=${VEHICLE_DATA_API_KEY_HEADER:x-authkey}
vehicle-data.vehicle-databases.max-requests-per-second=2
vehicle-data.http.connect-timeout-ms=5000
vehicle-data.http.read-timeout-ms=30000
vehicle-data.http.log-requests=false
logging.level.com.capstone.integration=INFO