spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.threads.virtual.enabled=true
security.jwt.secret=${SECRET_KEY:}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
security.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
security.cors.allowed-origins=http://localhost:5173,http://localhost:3000