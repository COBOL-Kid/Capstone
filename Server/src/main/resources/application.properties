spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.threads.virtual.enabled=true
security.jwt.secret=${SECRET_KEY:}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
security.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
security.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4200

# Vehicle data providers (set via env in deployment)
# vehicle-data.auto-dev.base-url=https://api.auto.dev
# vehicle-data.auto-dev.api-key=
# vehicle-data.auto-dev.api-key-header=x-api-key
# vehicle-data.vehicle-databases.base-url=https://api.vehicledatabases.com
# vehicle-data.vehicle-databases.api-key=
# vehicle-data.vehicle-databases.api-key-header=x-authkey
# Legacy aliases still supported: vehicle-data.base-url, vehicle-data.api-key
vehicle-data.http.connect-timeout-ms=5000
vehicle-data.http.read-timeout-ms=30000