# Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
# Threads
spring.threads.virtual.enabled=true
# Logging
logging.level.com.capstone.integration=INFO
# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
# Security
security.jwt.secret=${SECRET_KEY}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES}
security.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS}
security.email-verification.code-expiration-minutes=5
security.email-verification.unverified-account-retention-hours=24
security.email-verification.max-verification-attempts=5
security.email-verification.resend-cooldown-seconds=60
security.login.max-attempts-per-ip=5
security.login.rate-limit-window-minutes=15
security.cookies.secure=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Vehicle data providers
vehicle-data.autodev.base-url=${AUTODEV_BASE_URL}
vehicle-data.autodev.api-key=${AUTODEV_API_KEY}
vehicle-data.autodev.api-key-header=${AUTODEV_API_KEY_HEADER}
vehicle-data.vehicle-databases.base-url=${VEHICLE_DATA_BASE_URL}
vehicle-data.vehicle-databases.api-key=${VEHICLE_DATA_API_KEY}
vehicle-data.vehicle-databases.api-key-header=${VEHICLE_DATA_API_KEY_HEADER}
vehicle-data.vehicle-databases.max-requests-per-second=2
vehicle-data.http.connect-timeout-ms=5000
vehicle-data.http.read-timeout-ms=30000
vehicle-data.http.slow-request-threshold-ms=10000
# Mailjet
mailjet.enabled=${MAILJET_ENABLED}
mailjet.api-key-public=${MAILJET_API_KEY_PUBLIC}
mailjet.api-key-private=${MAILJET_API_KEY_PRIVATE}
mailjet.from-email=${MAILJET_FROM_EMAIL}
mailjet.from-name=${MAILJET_FROM_NAME}
