spring.config.import=
spring.datasource.url=jdbc:h2:mem:capstone;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
security.jwt.secret=test-jwt-secret-key-for-unit-tests-only
security.jwt.expiration-minutes=15
security.jwt.refresh-expiration-days=7
security.cookies.secure=false
security.cors.allowed-origins=http://localhost:3000
security.email-verification.code-expiration-minutes=5
security.email-verification.unverified-account-retention-hours=24
mailjet.enabled=false
mailjet.api-key-public=test-public
mailjet.api-key-private=test-private
mailjet.from-email=test@example.com
mailjet.from-name=Honest Car
vehicle-data.autodev.base-url=https://api.auto.dev
vehicle-data.autodev.api-key=test-autodev
vehicle-data.autodev.api-key-header=x-api-key
vehicle-data.vehicle-databases.base-url=https://api.vehicledatabases.com
vehicle-data.vehicle-databases.api-key=test-vdb
vehicle-data.vehicle-databases.api-key-header=x-authkey
vehicle-data.vehicle-databases.max-requests-per-second=2
vehicle-data.http.connect-timeout-ms=5000
vehicle-data.http.read-timeout-ms=30000
vehicle-data.http.slow-request-threshold-ms=10000
