spring.config.import=
spring.datasource.url=jdbc:h2:mem:capstone;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
vehicle-data.autodev.base-url=${AUTODEV_BASE_URL:https://api.auto.dev}
vehicle-data.autodev.api-key=${AUTODEV_API_KEY:test-autodev}
vehicle-data.autodev.api-key-header=${AUTODEV_API_KEY_HEADER:x-api-key}
vehicle-data.vehicle-databases.base-url=${VEHICLE_DATA_BASE_URL:https://api.vehicledatabases.com}
vehicle-data.vehicle-databases.api-key=${VEHICLE_DATA_API_KEY:test-vdb}
vehicle-data.vehicle-databases.api-key-header=${VEHICLE_DATA_API_KEY_HEADER:x-authkey}
vehicle-data.vehicle-databases.max-requests-per-second=2
